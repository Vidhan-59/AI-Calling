entry: greet
nodes:
  greet:
    objective: >
      Greet, state you are ShiftEaze's automated assistant, disclose the
      call is recorded, confirm you are speaking to the named operator.
    collect: [identity_verified]
    transitions:
      - when: "identity_verified == true"
        goto: offer_ot
      - when: "identity_verified == false"
        goto: wrong_person
      - when: "reprompts >= 2"
        goto: close_decline

  offer_ot:
    objective: >
      Describe the open overtime slot using the lookup_roster result -
      date, shift, terminal - and ask if they are willing to take it. You
      are asking, not assigning. A "no" is a completely acceptable answer;
      accept it on the first refusal, never ask twice, never mention that
      others have already declined.
    tools: [lookup_roster]
    collect: [ot_response]
    transitions:
      - when: "ot_response == \"accept\""
        goto: confirm_readback
      - when: "ot_response == \"decline\""
        goto: close_decline
      - when: "ot_response == \"conditional\""
        goto: capture_condition
      - when: "reprompts >= 1"
        goto: close_decline

  capture_condition:
    objective: >
      Capture their condition verbatim - e.g. "haan lekin 4 baje ke baad" -
      this is useful information for the Roster Planner, not a rejection.
    collect: [condition_reason]
    tools: [record_ot_response]
    transitions:
      - when: always
        goto: close_conditional

  confirm_readback:
    objective: >
      Read the shift back to them - date, shift, terminal, reporting time -
      and confirm they have it. This read-back is mandatory: a misheard OT
      commitment creates a gap nobody is expecting.
    tools: [record_ot_response]
    collect: [readback_confirmed]
    transitions:
      - when: always
        goto: close_accept

  wrong_person:
    objective: Ask nothing further about the operator, thank them, end the call.
    transitions: []

  close_accept:
    objective: Thank them warmly and close the call.
    tools: [end_call]
    transitions: []

  close_decline:
    objective: Thank them for the quick answer and close warmly - no persuasion.
    tools: [record_ot_response, end_call]
    transitions: []

  close_conditional:
    objective: Thank them, tell them the Roster Planner will confirm, close.
    tools: [end_call]
    transitions: []

terminal_nodes: [wrong_person, close_accept, close_decline, close_conditional]

id: shift_confirm
version: 1
display_name: Shift Confirmation Reminder
languages: [hi, gu, en]
default_language: hi

voice:
  hi: { provider: sarvam, voice_id: priya, speed: 1.0 }
  gu: { provider: azure, voice_id: gu-IN-DhwaniNeural, speed: 0.95 }
  en: { provider: elevenlabs, voice_id: "21m00Tcm4TlvDq8ikWAM", speed: 1.0 }

llm:
  conversation: { model: claude-haiku-4-5, max_tokens: 150, temperature: 0.4 }
  supervisor: { model: claude-sonnet-5, enabled: true }

persona_file: prompts/agents/shift_confirm/persona.j2
flow: flows/shift_confirm.yaml

tools:
  - lookup_roster
  - confirm_shift
  - mark_absence_intent
  - schedule_callback
  - send_sms_fallback
  - transfer_to_agent
  - transfer_to_human
  - end_call

guardrails:
  - no_wage_discussion
  - no_leave_approval
  - no_third_party_employee_data
  - disclose_ai_and_recording
  - hallucination_guard

limits:
  max_duration_sec: 180
  max_turns: 24
  max_reprompts_per_slot: 2

retry:
  attempts: 3
  backoff: ["15m", "2h", "6h"]
  on_no_answer: sms_fallback

calling_window: { start: "07:00", end: "21:00", tz: "Asia/Kolkata" }

success_slots: [identity_verified, attendance_intent]

id: ot_request
version: 1
display_name: Overtime Request
languages: [hi, gu, en]
default_language: hi

voice:
  hi: { provider: omnivoice, voice_id: default, speed: 1.0 }
  gu: { provider: omnivoice, voice_id: default, speed: 0.95 }
  en: { provider: omnivoice, voice_id: default, speed: 1.0 }

llm:
  conversation: { model: claude-haiku-4-5, max_tokens: 150, temperature: 0.4 }
  supervisor: { model: claude-sonnet-5, enabled: true }

persona_file: prompts/agents/ot_request/persona.j2
flow: flows/ot_request.yaml

tools:
  - lookup_roster
  - record_ot_response
  - transfer_to_human
  - end_call

guardrails:
  - no_wage_discussion
  - no_disciplinary_threat
  - no_third_party_employee_data
  - disclose_ai_and_recording
  - hallucination_guard

limits:
  max_duration_sec: 150
  max_turns: 20
  max_reprompts_per_slot: 1

retry:
  attempts: 2
  backoff: ["20m", "2h"]
  on_no_answer: sms_fallback

calling_window: { start: "07:00", end: "21:00", tz: "Asia/Kolkata" }

success_slots: [identity_verified, ot_response]

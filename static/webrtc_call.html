<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebRTC Test Call</title>
<style>
  :root { --bg: #fafafa; --fg: #1a1a1a; --muted: #666; --line: #ddd; --accent: #0b6bcb; --bad: #b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141414; --fg: #eee; --muted: #999; --line: #333; --accent: #4ea1f0; --bad: #f97066; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); font: inherit; }
  textarea { min-height: 90px; font-family: ui-monospace, monospace; font-size: 13px; }
  .row { display: flex; gap: 12px; } .row > div { flex: 1; }
  button { margin-top: 18px; padding: 10px 18px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button[disabled] { opacity: .5; cursor: default; }
  #hangup { background: var(--bad); }
  #status { margin-top: 18px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; font-family: ui-monospace, monospace; font-size: 13px; white-space: pre-wrap; min-height: 2.5em; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>WebRTC test call</h1>
  <p class="sub">Talk to the calling agent from this browser. Same pipeline as a phone call: noise suppression, Silero VAD, barge-in, streaming replies.</p>

  <label for="key">Admin API key (X-API-Key; leave empty if ADMIN_API_KEY is unset)</label>
  <input id="key" type="password" autocomplete="off">

  <div class="row">
    <div><label for="mode">Mode</label>
      <select id="mode"><option value="scenario">Scripted scenario</option><option value="agent">LLM agent (call task)</option></select></div>
    <div><label for="language">Language</label>
      <select id="language"><option value="hi">Hindi</option><option value="gu">Gujarati</option><option value="en">English</option></select></div>
  </div>

  <div id="scenarioFields">
    <label for="scenario">Scenario</label>
    <input id="scenario" value="shift_confirm">
    <label for="facts">Facts (JSON)</label>
    <textarea id="facts">{"employee_name": "अमित", "date": "कल", "time": "सुबह आठ", "shift_name": "डे", "terminal": "CT3"}</textarea>
  </div>
  <div id="agentFields" class="hidden">
    <label for="task">Call task ID</label>
    <input id="task" placeholder="from POST /dialer/campaigns/.../tasks">
  </div>

  <button id="start">Start call</button>
  <button id="hangup" disabled>Hang up</button>
  <div id="status">Idle.</div>
  <audio id="bot" autoplay></audio>
</main>
<script>
const $ = (id) => document.getElementById(id);
let pc = null, mic = null;
const log = (msg) => { $("status").textContent = msg; };

$("mode").onchange = () => {
  const agent = $("mode").value === "agent";
  $("agentFields").classList.toggle("hidden", !agent);
  $("scenarioFields").classList.toggle("hidden", agent);
};

function waitForIce(conn) {
  if (conn.iceGatheringState === "complete") return Promise.resolve();
  return new Promise((resolve) => {
    const done = () => { if (conn.iceGatheringState === "complete") { conn.removeEventListener("icegatheringstatechange", done); resolve(); } };
    conn.addEventListener("icegatheringstatechange", done);
    setTimeout(resolve, 2000);  // enough candidates by now - don't hang on a slow STUN
  });
}

$("start").onclick = async () => {
  let facts = {};
  try { facts = JSON.parse($("facts").value || "{}"); } catch { return log("Facts must be valid JSON."); }
  $("start").disabled = true;
  try {
    log("Asking for the microphone...");
    // Browser-side echo cancellation keeps the bot's own voice out of the
    // mic, so it can't barge in on itself. Server-side RNNoise handles noise.
    mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: true } });
    pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
    pc.ontrack = (e) => { $("bot").srcObject = e.streams[0]; };
    pc.onconnectionstatechange = () => {
      log("Connection: " + pc.connectionState);
      if (["failed", "closed", "disconnected"].includes(pc.connectionState)) hangUp();
    };
    mic.getTracks().forEach((t) => pc.addTrack(t, mic));
    await pc.setLocalDescription(await pc.createOffer());
    await waitForIce(pc);

    log("Connecting...");
    const res = await fetch("/webrtc/offer", {
      method: "POST",
      headers: { "Content-Type": "application/json", ...($("key").value ? { "X-API-Key": $("key").value } : {}) },
      body: JSON.stringify({
        sdp: pc.localDescription.sdp, type: pc.localDescription.type,
        call: { mode: $("mode").value, scenario_id: $("scenario").value, language: $("language").value, facts, task_id: $("task").value || null },
      }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || res.statusText);
    await pc.setRemoteDescription({ sdp: body.sdp, type: body.type });
    log("Call started (" + body.call_id + "). Speak any time - you can interrupt the bot.");
    $("hangup").disabled = false;
  } catch (e) {
    log("Error: " + e.message);
    hangUp();
  }
};

function hangUp() {
  if (pc) { pc.close(); pc = null; }
  if (mic) { mic.getTracks().forEach((t) => t.stop()); mic = null; }
  $("start").disabled = false;
  $("hangup").disabled = true;
}
$("hangup").onclick = () => { hangUp(); log("Hung up."); };
</script>
</body>
</html>

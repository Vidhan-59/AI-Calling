<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Studio</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --ink: #12161d; --muted: #5b6575; --faint: #8a94a4;
    --line: #e1e5eb; --line-strong: #cbd2dc;
    --accent: #2b59d9; --accent-ink: #ffffff; --accent-soft: #e8eefc;
    --ok: #17794a; --ok-soft: #e3f4ea; --warn: #8f5f00; --warn-soft: #fdf1d8; --bad: #bf3a2f; --bad-soft: #fbe7e4;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .06);
    --shadow-lg: 0 12px 32px rgba(16, 24, 40, .16);
    --radius: 10px; --radius-sm: 7px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1217; --surface: #171b22; --surface-2: #1e232c; --ink: #e9edf3; --muted: #a0aab9; --faint: #727d8e;
      --line: #28303b; --line-strong: #394352;
      --accent: #7a9cf5; --accent-ink: #0b1020; --accent-soft: #1d2744;
      --ok: #4cc38a; --ok-soft: #12291f; --warn: #e3b341; --warn-soft: #2d2410; --bad: #f0766b; --bad-soft: #321a18;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* shell */
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 20px; padding: 0 24px; height: 56px;
            background: var(--surface); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 15px; color: var(--ink); }
  .brand i { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; }
  .brand i::after { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent-ink); }
  .nav { display: flex; gap: 2px; }
  .nav a { padding: 6px 12px; border-radius: 6px; color: var(--muted); font-weight: 500; }
  .nav a:hover { background: var(--surface-2); text-decoration: none; color: var(--ink); }
  .nav a[aria-current="page"] { color: var(--ink); background: var(--surface-2); }
  .spacer { flex: 1; }
  .conn { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
  main { max-width: 1240px; margin: 0 auto; padding: 28px 24px 80px; }

  /* primitives */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 14px;
         border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); cursor: pointer; font-weight: 500;
         white-space: nowrap; transition: background .12s, border-color .12s, opacity .12s; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { opacity: .92; }
  .btn.danger { color: var(--bad); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 99px; font-size: 12px; font-weight: 500;
          background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
  .pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
  .pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12.5px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .stack { display: grid; gap: 14px; }
  label.f { display: block; }
  label.f > span { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); margin-bottom: 5px; }
  input[type=text], input[type=url], input[type=password], input[type=search], select, textarea {
    width: 100%; padding: 7px 10px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); }
  textarea { resize: vertical; min-height: 84px; line-height: 1.5; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .counter { text-align: right; font-size: 12px; color: var(--faint); margin-top: 3px; }
  .counter.over { color: var(--bad); }
  .hint { color: var(--muted); font-size: 12.5px; margin: 4px 0 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .empty { padding: 36px 20px; text-align: center; color: var(--muted); }
  .empty h3 { color: var(--ink); margin-bottom: 4px; }
  .banner { padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; border: 1px solid var(--line); background: var(--surface-2); }
  .banner.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .banner.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
  .banner.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }

  /* dashboard */
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .page-head h1 { font-size: 24px; } .page-head p { margin: 4px 0 0; color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 26px; }
  .stat { padding: 14px 16px; }
  .stat .v { font-size: 26px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat .k { color: var(--muted); font-size: 12.5px; }
  .section-title { display: flex; justify-content: space-between; align-items: center; margin: 0 0 12px; }
  .section-title h2 { font-size: 15px; }
  .agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .agent { padding: 16px; display: grid; gap: 12px; transition: border-color .12s, box-shadow .12s; }
  .agent:hover { border-color: var(--line-strong); box-shadow: var(--shadow-lg); }
  .agent-head { display: flex; gap: 12px; align-items: center; }
  .avatar { width: 44px; height: 44px; border-radius: 12px; flex: none; display: grid; place-items: center; font-size: 22px;
            font-weight: 600; overflow: hidden; background: var(--accent-soft); color: var(--accent); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar.lg { width: 64px; height: 64px; border-radius: 16px; font-size: 30px; }
  .agent h3 { font-size: 15px; } .agent-meta { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; }
  .agent-meta dt { color: var(--faint); } .agent-meta dd { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .activity { display: grid; }
  .activity div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); }
  .activity div:first-child { border-top: 0; }

  /* editor */
  .editor { display: grid; grid-template-columns: 220px minmax(0, 1fr) 330px; gap: 20px; align-items: start; }
  .rail { position: sticky; top: 76px; display: grid; gap: 14px; }
  .steps { display: grid; gap: 2px; padding: 8px; }
  .step { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px; cursor: pointer; color: var(--muted); border: 0; background: none; text-align: left; width: 100%; }
  .step:hover { background: var(--surface-2); }
  .step[aria-current="step"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .step .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; border: 1.5px solid var(--line-strong); flex: none; }
  .step.done .n { background: var(--ok); border-color: var(--ok); color: #fff; }
  .progress { height: 6px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
  .panel { padding: 22px; }
  .panel > h2 { font-size: 17px; margin-bottom: 2px; } .panel > .lead { margin: 0 0 18px; color: var(--muted); }
  .side { position: sticky; top: 76px; display: grid; gap: 14px; }
  .side .card { padding: 16px; }
  .side h3 { font-size: 14px; margin-bottom: 8px; }
  .savebar { display: flex; gap: 8px; align-items: center; padding: 12px 14px; }
  .avatar-picker { display: flex; flex-wrap: wrap; gap: 6px; }
  .avatar-picker button { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 18px; }
  .avatar-picker button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

  /* voice */
  .voices { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .voice { text-align: left; padding: 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: var(--surface); cursor: pointer; display: grid; gap: 4px; }
  .voice:hover { border-color: var(--line-strong); }
  .voice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .voice b { font-weight: 600; }
  .range { display: grid; gap: 4px; }
  .range .top { display: flex; justify-content: space-between; align-items: baseline; }
  .range .val { font-variant-numeric: tabular-nums; font-weight: 600; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 24px; }
  .caps { width: 100%; border-collapse: collapse; font-size: 13px; }
  .caps td { padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  .caps td:first-child { width: 150px; font-weight: 500; }
  .disabled-control { opacity: .55; pointer-events: none; }
  details.create { border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 12px 14px; }
  details.create summary { cursor: pointer; font-weight: 600; }

  /* preview */
  .wave { display: flex; align-items: center; gap: 3px; height: 40px; margin: 10px 0; }
  .wave i { flex: 1; background: var(--line-strong); border-radius: 2px; height: 20%; transition: background .2s; }
  .wave.live i { background: var(--accent); animation: bar 0.9s ease-in-out infinite; }
  @keyframes bar { 0%, 100% { height: 18%; } 50% { height: 92%; } }
  @media (prefers-reduced-motion: reduce) { .wave.live i { animation: none; height: 60%; } }

  /* training */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 8px 12px; border: 0; background: none; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
  .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .pill { margin-left: 6px; }
  .item { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; background: var(--surface); display: grid; gap: 10px; }
  .item textarea { min-height: 70px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
  .turn { display: grid; grid-template-columns: 96px 1fr auto; gap: 8px; align-items: start; }
  .turn .who { height: 32px; }
  table.qa { width: 100%; border-collapse: collapse; }
  table.qa th { text-align: left; font-size: 12px; color: var(--faint); font-weight: 500; padding: 6px 8px; }
  table.qa td { padding: 8px; border-top: 1px solid var(--line); vertical-align: top; }
  .hit { border-left: 3px solid var(--accent); padding: 6px 10px; background: var(--surface-2); border-radius: 0 6px 6px 0; margin-top: 8px; }

  /* call now */
  .checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .checks li { display: flex; gap: 8px; align-items: baseline; }
  .checks .ok { color: var(--ok); } .checks .no { color: var(--bad); }
  .callbox { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; background: var(--surface-2); }
  .callstate { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .callstate .dot { width: 10px; height: 10px; }
  .callstate .dot.live { background: var(--ok); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .transcript { display: grid; gap: 8px; max-height: 340px; overflow: auto; }
  .line { display: grid; grid-template-columns: 74px 1fr; gap: 10px; }
  .line b { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding-top: 2px; }
  .line.agent b { color: var(--accent); }

  /* modal / toast */
  .overlay { position: fixed; inset: 0; background: rgba(8, 12, 20, .5); display: grid; place-items: center; z-index: 50; padding: 20px; }
  .modal { width: min(760px, 100%); max-height: 86vh; overflow: auto; padding: 22px; box-shadow: var(--shadow-lg); }
  pre.prompt { white-space: pre-wrap; word-break: break-word; background: var(--surface-2); padding: 14px; border-radius: 8px; font-size: 13px; max-height: 50vh; overflow: auto; }
  #toasts { position: fixed; right: 18px; bottom: 18px; display: grid; gap: 8px; z-index: 60; }
  .toast { padding: 10px 14px; border-radius: 8px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow-lg); max-width: 380px; font-size: 13px; }
  .toast.bad { background: var(--bad); color: #fff; }
  .skeleton { background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: 8px; min-height: 120px; }
  @keyframes sk { to { background-position: -200% 0; } }

  @media (max-width: 1100px) { .editor { grid-template-columns: 200px minmax(0, 1fr); } .side { grid-column: 1 / -1; position: static; } }
  @media (max-width: 760px) {
    main { padding: 16px 14px 60px; } .topbar { padding: 0 14px; gap: 10px; }
    .editor { grid-template-columns: 1fr; } .rail { position: static; } .steps { display: flex; overflow-x: auto; }
    .step { white-space: nowrap; } .grid2, .grid3 { grid-template-columns: 1fr; }
    .turn { grid-template-columns: 1fr; } .conn span.t { display: none; }
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/"><i></i>Agent Studio</a>
  <nav class="nav" aria-label="Main">
    <a href="#/" id="navAgents">AI Agents</a>
    <a href="/voice-studio" target="_blank" rel="noopener">Voices</a>
    <a href="#/diagnostics" id="navDiag">Audio diagnostics</a>
  </nav>
  <div class="spacer"></div>
  <div class="conn"><span class="dot" id="connDot"></span><span class="t" id="connText">Not connected</span>
    <button class="btn sm" id="keyBtn">API key</button></div>
</header>
<main id="app" aria-live="polite"></main>
<div id="toasts" role="status"></div>
<div id="modalRoot"></div>

<script>
"use strict";
/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LANG = { hi: "Hindi", gu: "Gujarati", en: "English" };
const EMOJI = ["🎧", "🤖", "📞", "🧑‍💼", "👩‍💼", "🛠️", "📅", "💬", "🚚", "🏥", "🎓", "🛒"];
const store = {
  get key() { try { return localStorage.getItem("adminKey") || ""; } catch { return ""; } },
  set key(v) { try { localStorage.setItem("adminKey", v); } catch { /* private mode */ } },
};

class ApiError extends Error { constructor(status, msg) { super(msg); this.status = status; } }
async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (store.key) headers["X-API-Key"] = store.key;
  let body = opts.body;
  if (body && !(body instanceof FormData) && typeof body !== "string") { body = JSON.stringify(body); headers["Content-Type"] = "application/json"; }
  const res = await fetch(path, { ...opts, headers, body });
  if (!res.ok) {
    let msg = res.statusText;
    try { const j = await res.json(); msg = typeof j.detail === "string" ? j.detail : (j.detail || []).map((d) => `${(d.loc || []).slice(1).join(".")}: ${d.msg}`).join("; ") || msg; } catch { /* not json */ }
    throw new ApiError(res.status, msg);
  }
  if (res.status === 204) return null;
  const ct = res.headers.get("content-type") || "";
  return ct.includes("json") ? res.json() : res;
}
function toast(msg, bad = false, ms = 4000) {
  const t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : ""); t.textContent = msg;
  $("#toasts").appendChild(t); setTimeout(() => t.remove(), ms);
}
function setConn(state, text) { $("#connDot").className = "dot " + state; $("#connText").textContent = text; }
const ago = (iso) => {
  if (!iso) return "-"; const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago"; return new Date(iso).toLocaleDateString();
};
const fmtDur = (s) => { s = Math.round(s || 0); return s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${s}s`; };
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function modal(html, { onClose } = {}) {
  const root = $("#modalRoot");
  root.innerHTML = `<div class="overlay" role="dialog" aria-modal="true"><div class="card modal">${html}</div></div>`;
  const close = () => { root.innerHTML = ""; document.removeEventListener("keydown", onKey); onClose && onClose(); };
  const onKey = (e) => e.key === "Escape" && close();
  document.addEventListener("keydown", onKey);
  $(".overlay", root).addEventListener("mousedown", (e) => e.target.classList.contains("overlay") && close());
  $$("[data-close]", root).forEach((b) => (b.onclick = close));
  return close;
}
function confirmDialog(title, text, okLabel = "Delete") {
  return new Promise((resolve) => {
    const close = modal(`<h3>${esc(title)}</h3><p class="muted">${esc(text)}</p>
      <div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn" data-close>Cancel</button><button class="btn danger" id="cfOk">${esc(okLabel)}</button></div>`,
      { onClose: () => resolve(false) });
    $("#cfOk").onclick = () => { resolve(true); $("#modalRoot").innerHTML = ""; };
    void close;
  });
}
function avatarHtml(a, cls = "") {
  const v = a.avatar || "";
  if (v.startsWith("data:image/")) return `<div class="avatar ${cls}"><img alt="" src="${esc(v)}"></div>`;
  return `<div class="avatar ${cls}">${esc(v || (a.name || "?").trim().charAt(0).toUpperCase())}</div>`;
}
const statusPill = (s) => `<span class="pill ${s === "active" ? "ok" : s === "published" ? "accent" : ""}">${s === "active" ? "● " : ""}${esc(s[0].toUpperCase() + s.slice(1))}</span>`;

/* ---------- state ---------- */
const S = { meta: null, voices: null, voicesErr: "", stats: null, agents: [], draft: null, saved: "", id: null, step: 1, tab: "script", training: [],
            preview: { state: "idle", url: "", sig: "", err: "", text: "" } };
const SAMPLE = { hi: "नमस्ते, मैं आपकी कैसे मदद कर सकती हूँ?", gu: "નમસ્તે, હું તમારી કેવી રીતે મદદ કરી શકું?", en: "Hello! Thank you for calling. How can I help you today?" };
const blankAgent = () => ({ name: "", description: "", avatar: "🎧", use_case_id: "", language: "hi", status: "draft",
  voice: { voice_id: null, speed: 1.0, style: null, tone: null }, personality: {}, system_instructions: "", basic: { purpose: "", objective: "" } });
const dirty = () => S.draft && JSON.stringify(S.draft) !== S.saved;
window.addEventListener("beforeunload", (e) => { if (dirty()) { e.preventDefault(); e.returnValue = ""; } });

/* ---------- router ---------- */
async function route() {
  const h = location.hash.replace(/^#/, "") || "/";
  $$(".nav a").forEach((a) => a.removeAttribute("aria-current"));
  stopPreview(); stopCallPolling();
  if (!(await ensureConnected())) return;
  try {
    if (h === "/") { $("#navAgents").setAttribute("aria-current", "page"); await dashboard(); }
    else if (h === "/diagnostics") { $("#navDiag").setAttribute("aria-current", "page"); await diagnostics(); }
    else if (h.startsWith("/agent/")) { $("#navAgents").setAttribute("aria-current", "page"); await editor(h.slice(7)); }
    else location.hash = "#/";
  } catch (e) { handleError(e); }
}
function handleError(e) {
  if (e.status === 401) { setConn("bad", "Key rejected"); $("#app").innerHTML = connectCard("The API key was rejected. Enter the admin key to continue."); bindConnect(); }
  else { console.error(e); $("#app").innerHTML = `<div class="card empty"><h3>Something went wrong</h3><p>${esc(e.message)}</p><button class="btn" onclick="route()">Try again</button></div>`; }
}
const connectCard = (msg) => `<div class="card" style="max-width:440px;margin:60px auto;padding:24px"><h2>Connect</h2><p class="muted">${esc(msg)}</p>
  <label class="f"><span>Admin API key (X-API-Key)</span><input type="password" id="ckey" autocomplete="off" value="${esc(store.key)}"></label>
  <div class="row" style="margin-top:14px"><button class="btn primary" id="cgo">Connect</button></div></div>`;
function bindConnect() { $("#cgo").onclick = () => { store.key = $("#ckey").value.trim(); S.meta = null; route(); }; $("#ckey").onkeydown = (e) => e.key === "Enter" && $("#cgo").click(); }
async function ensureConnected() {
  if (S.meta) return true;
  try {
    S.meta = await api("/studio/meta");
    setConn("ok", "Connected");
    return true;
  } catch (e) {
    if (e.status === 401) { setConn("bad", "API key needed"); $("#app").innerHTML = connectCard(store.key ? "The API key was rejected." : "This server requires an admin key. Leave blank if ADMIN_API_KEY is not set."); bindConnect(); }
    else { setConn("bad", "Server unreachable"); $("#app").innerHTML = `<div class="card empty"><h3>Cannot reach the server</h3><p>${esc(e.message)}</p><button class="btn" onclick="route()">Retry</button></div>`; }
    return false;
  }
}
$("#keyBtn").onclick = () => { S.meta = null; $("#app").innerHTML = connectCard("Enter the admin API key."); bindConnect(); };
window.addEventListener("hashchange", async () => {

/* ---------- diagnostics ---------- */
async function diagnostics() {
  $("#app").innerHTML = `<div class="page-head"><div><h1>Audio diagnostics</h1><p>Why speech might break up, from live calls and the voice service.</p></div><button class="btn" id="dref">Refresh</button></div><div class="skeleton"></div>`;
  const d = await api("/studio/diagnostics/audio");
  const p = d.playout, g = d.gpu, t = d.tts_service;
  const kv = (k, v) => `<tr><td class="muted">${k}</td><td><b>${v ?? "-"}</b></td></tr>`;
  const warn = [];
  if (g.available && g.power_capped) warn.push(`The GPU is power-capped (running at ${Math.round(g.sm_clock_mhz)} of ${Math.round(g.max_sm_clock_mhz)} MHz). On a laptop this usually means it is on battery: plug in AC power - voice synthesis is 2-4x slower when capped, which is the most common cause of speech breaking up.`);
  if (g.available && g.thermal_throttled) warn.push("The GPU is thermally throttled.");
  if (t.status === "unreachable") warn.push("The voice service (OmniVoice) is not reachable: " + t.error);
  if (p.underruns > 0) warn.push(`${p.underruns} playback gap(s) in recent replies (longest ${p.max_gap_ms} ms): the next piece of speech was not ready when the previous one finished.`);
  $("#app").innerHTML = `<div class="page-head"><div><h1>Audio diagnostics</h1><p>Why speech might break up, from live calls and the voice service.</p></div><button class="btn" id="dref">Refresh</button></div>
    <div class="stack">${warn.map((w) => `<div class="banner warn">${esc(w)}</div>`).join("") || `<div class="banner ok">No audio problems detected.</div>`}
    <div class="grid2">
      <div class="card panel"><h2>Speech continuity</h2><p class="lead small">Since the server started (live agent calls).</p><table class="caps">
        ${kv("Replies spoken", p.replies)}${kv("Pieces synthesized", p.pieces)}${kv("Cache hits", p.cache_hits)}${kv("Underruns (audible gaps)", p.underruns)}
        ${kv("Mean / max gap", `${p.mean_gap_ms} / ${p.max_gap_ms} ms`)}${kv("Interruptions (barge-in)", p.interruptions)}${kv("TTS errors", p.tts_errors)}
        ${kv("Synthesis time p50 / p95", `${p.synth_ms_p50 ?? "-"} / ${p.synth_ms_p95 ?? "-"} ms`)}${kv("Time to first audio (p50)", p.first_audio_ms_p50 == null ? "-" : p.first_audio_ms_p50 + " ms")}
        ${kv("Avg diffusion steps", p.avg_steps)}</table></div>
      <div class="card panel"><h2>Voice service &amp; GPU</h2><p class="lead small">OmniVoice runs as its own process.</p><table class="caps">
        ${kv("Service", t.status)}${kv("Engine", t.engine)}${kv("Model on GPU", t.on_gpu == null ? "-" : t.on_gpu ? "yes" : "parked (wakes on demand)")}
        ${kv("Queue depth", t.queue_depth)}${kv("Last synthesis", t.last_synth_ms == null ? "-" : Math.round(t.last_synth_ms) + " ms")}
        ${g.available ? kv("GPU", esc(g.name)) + kv("Clock", `${Math.round(g.sm_clock_mhz)} / ${Math.round(g.max_sm_clock_mhz)} MHz`) + kv("Power", g.power_w + " W") + kv("Utilization", g.utilization_pct + "%") : kv("GPU", "no NVIDIA GPU info")}
      </table></div></div></div>`;
  $("#dref").onclick = () => diagnostics().catch(handleError);
}

async function saveAgent() {
  const d = S.draft;

  const body = { name: d.name.trim(), description: d.description, avatar: d.avatar, use_case_id: d.use_case_id || "", language: d.language,
    voice: d.voice, personality: d.personality, system_instructions: d.system_instructions, basic: d.basic };
  try {
    const a = S.id ? await api(`/studio/agents/${S.id}`, { method: "PUT", body }) : await api("/studio/agents", { method: "POST", body });

    toast(wasNew ? "Agent created" : "Saved");

}

function shrinkImage(file, size) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = c.height = size; const ctx = c.getContext("2d");
      const s = Math.min(img.width, img.height); ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url); resolve(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("That file is not a readable image.")); };
    img.src = url;
  });
}

/* step 3 */

    <div class="stack">
      <div class="row" style="gap:14px">${avatarHtml(d)}<div><b>${esc(d.name || "Unnamed agent")}</b><div class="small muted">${esc(LANG[d.language])} · voice ${esc(vname)} · ${d.voice.speed.toFixed(2)}× · uses the saved configuration and training</div></div></div>
      <div><div class="small muted" style="font-weight:500;margin-bottom:4px">Number that will be called</div>
        ${cfg.number_set ? `<b style="font-size:16px;font-variant-numeric:tabular-nums">${esc(cfg.number_masked)}</b> <span class="small muted">· set by STUDIO_CALL_NUMBER in .env</span>`
          : `<span class="pill bad">Not set</span> <span class="small muted">add STUDIO_CALL_NUMBER=+919876543210 to .env</span>`}</div>
      <ul class="checks">${checks.map(([good, t]) => `<li><span class="${good ? "ok" : "no"}">${good ? "✓" : "✕"}</span><span class="${good ? "" : "muted"}">${esc(t)}</span></li>`).join("")}</ul>
      ${cfg.problems.map((p) => `<div class="banner warn">${esc(p)}</div>`).join("")}
      <div class="row"><button class="btn primary" id="callBtn" style="height:40px;padding:0 22px" ${ok ? "" : "disabled"}>📞 Call now</button>
        ${!ok && saved && !clean ? '<span class="small muted">Save your changes first.</span>' : ""}</div>
      <div id="callBox"></div>
    </div>`;
  $("#callBtn").onclick = async () => {
    if (!(await confirmDialog(`Call ${cfg.number_masked} now?`, `This places a real phone call to that number and connects it to "${d.name}". Calls are billed by Twilio.`, "Call now"))) return;
    $("#callBtn").disabled = true;
    try {
      const r = await api(`/studio/agents/${S.id}/call`, { method: "POST" });
      S.call = { id: r.call_id, to: r.to }; toast("Calling…"); renderCall(null);
      startCallPolling();
    } catch (e) { toast(e.message, true, 9000); $("#callBtn").disabled = false; }
  };
  if (S.call) { renderCall(null); if (!S.call.ended) startCallPolling(); }
}
function startCallPolling() {
  stopCallPolling();
  const tick = async () => {
    if (!S.call || S.step !== 5) return stopCallPolling();
    try {
      const c = await api(`/studio/calls/${S.call.id}`);
      renderCall(c);
      if (c.status === "completed" || c.status === "failed") { S.call.ended = true; stopCallPolling(); if ($("#callBtn")) $("#callBtn").disabled = false; }
    } catch (e) { stopCallPolling(); toast(e.message, true); }
  };
  tick(); callTimer = setInterval(tick, 2000);
}
function renderCall(c) {
  const box = $("#callBox"); if (!box) return;
  const st = c ? c.status : "connecting", live = st === "connecting" || st === "in_progress";
  const msgs = c ? c.messages : [];
  box.innerHTML = `<div class="callbox"><div class="row between"><div class="callstate"><span class="dot ${live ? "live" : st === "failed" ? "bad" : "ok"}"></span>${esc(CALL_LABEL[st] || st)}${c && c.duration_secs ? `<span class="muted small" style="font-weight:400">· ${fmtDur(c.duration_secs)}</span>` : ""}</div>
      ${live ? '<button class="btn sm danger" id="hangBtn">Hang up</button>' : ""}</div>
    ${c && c.error ? `<div class="banner bad">${esc(c.error)}</div>` : ""}
    <div class="transcript" aria-live="polite">${msgs.map((m) => `<div class="line ${m.speaker === "agent" ? "agent" : ""}"><b>${m.speaker === "agent" ? "Agent" : "Customer"}</b><span>${esc(m.message)}</span></div>`).join("")
      || `<span class="muted small">${live ? "The conversation will appear here as it happens." : "No conversation was recorded."}</span>`}</div></div>`;
  if ($("#hangBtn")) $("#hangBtn").onclick = async () => { try { await api(`/studio/calls/${S.call.id}/end`, { method: "POST" }); toast("Hanging up…"); } catch (e) { toast(e.message, true); } };
}

/* ---------- live voice preview (side panel) ---------- */
let audioEl = null;
function stopPreview() { if (audioEl) { audioEl.pause(); audioEl = null; } }
function previewParams() { const d = S.draft; return { language: d.language, voice_id: d.voice.voice_id, speed: d.voice.speed }; }
function voiceLabel() { const d = S.draft, v = S.voices; if (!v) return "Voice service offline"; const x = v.voices.find((y) => y.id === (d.voice.voice_id || v.default_voice_id)); return x ? x.name + (d.voice.voice_id ? "" : " (library default)") : "No voice available"; }
function renderSide() {
  const d = S.draft, pv = S.preview;
  if (!pv.text || pv.langFor !== d.language) { pv.text = SAMPLE[d.language]; pv.langFor = d.language; }
  $("#sidePanel").innerHTML = `
    <div class="card"><h3>Live voice preview</h3>
      <div class="row small" style="margin-bottom:8px"><span class="pill accent">${esc(voiceLabel())}</span><span class="pill">${LANG[d.language]}</span><span class="pill">${d.voice.speed.toFixed(2)}×</span></div>
      <label class="f"><span>Enter text to preview your agent's voice</span><textarea id="pvText" maxlength="300" style="min-height:76px">${esc(pv.text)}</textarea></label>
      <div class="wave ${pv.state === "playing" ? "live" : ""}" aria-hidden="true">${Array.from({ length: 28 }, (_, i) => `<i style="animation-delay:${(i * 53) % 900}ms"></i>`).join("")}</div>
      <div class="row">
        ${pv.state === "playing" ? '<button class="btn" id="pvPause">Pause</button>' : pv.state === "paused" ? '<button class="btn primary" id="pvResume">Resume</button>'
          : `<button class="btn primary" id="pvPlay" ${pv.state === "loading" ? "disabled" : ""}>${pv.state === "loading" ? "Generating…" : "Play preview"}</button>`}
        <button class="btn" id="pvReplay" ${pv.url ? "" : "disabled"}>Replay</button></div>
      ${pv.state === "error" ? `<div class="banner bad small" style="margin-top:10px">${esc(pv.err)}</div>` : ""}
      <p class="hint">Uses the real OmniVoice engine with the voice and speed above (unsaved changes included). Style and tone only affect the agent's wording, not this audio.</p></div>`;
  $("#pvText").oninput = (e) => (S.preview.text = e.target.value);
  const play = $("#pvPlay"); if (play) play.onclick = () => runPreview(false);
  if ($("#pvPause")) $("#pvPause").onclick = () => { audioEl.pause(); setPv({ state: "paused" }); };
  if ($("#pvResume")) $("#pvResume").onclick = () => audioEl.play();
  $("#pvReplay").onclick = () => runPreview(true);
}
function setPv(p) { Object.assign(S.preview, p); if ($("#sidePanel")) { const t = $("#pvText") ? $("#pvText").value : S.preview.text; S.preview.text = t; renderSide(); } }
async function runPreview(replay) {
  const text = ($("#pvText").value || "").trim(); if (!text) { toast("Type some text to preview.", true); return; }
  const params = { ...previewParams(), text }, sig = JSON.stringify(params);
  stopPreview();
  try {
    if (!(replay && S.preview.url && S.preview.sig === sig)) {
      setPv({ state: "loading", err: "" });
      const res = await api("/voices/preview", { method: "POST", body: params });
      const blob = await res.blob(); if (S.preview.url) URL.revokeObjectURL(S.preview.url);
      S.preview.url = URL.createObjectURL(blob); S.preview.sig = sig;
    }
    audioEl = new Audio(S.preview.url);
    audioEl.onplay = () => setPv({ state: "playing" });
    audioEl.onpause = () => { if (audioEl && !audioEl.ended && S.preview.state === "playing") setPv({ state: "paused" }); };
    audioEl.onended = () => setPv({ state: "idle" });
    audioEl.onerror = () => setPv({ state: "error", err: "The browser could not play this audio." });
    await audioEl.play();
  } catch (e) {
    setPv({ state: "error", err: e.status === 503 ? "The voice service (OmniVoice) is offline or still loading. Start it with tts_service/run-tts.ps1 and try again." : e.message });
  }
}

/* ---------- boot ---------- */
if (store.key === "" && location.search.includes("key=")) { /* never accept keys from URLs */ }
route();
</script>
</body>
</html>
